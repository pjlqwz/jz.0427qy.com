<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>确认订单 · 拾光小馆</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  /* 取餐方式 */
  .k-switch {
    display: flex; gap: 4px;
    margin: 12px 14px 0;
    padding: 4px;
    background: #efe9e2;
    border-radius: 12px;
  }
  .k-switch button {
    flex: 1;
    height: 34px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--ink2);
    transition: all .18s ease;
  }
  .k-switch button.is-on {
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(34, 29, 25, .1);
  }

  .k-card { margin: 10px 14px 0; }

  /* 地址块 */
  .k-addr { padding: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .k-addr .pin {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--brandSoft); color: var(--brandInk);
  }
  .k-addr .pin svg { width: 18px; height: 18px; }
  .k-addr .who { font-size: 14.5px; font-weight: 600; }
  .k-addr .who span { margin-left: 6px; font-size: 12.5px; font-weight: 400; color: var(--ink3); }
  .k-addr .where { margin-top: 4px; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
  .k-addr .arr { align-self: center; color: var(--ink4); }
  .k-addr .arr svg { width: 16px; height: 16px; }

  /* 时间选择 */
  .k-time { padding: 12px 14px 14px; border-top: 1px solid var(--line2); }
  .k-time .h { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink2); margin-bottom: 9px; }
  .k-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .k-chip {
    height: 32px; padding: 0 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fdfbf9;
    font-size: 12.5px; color: var(--ink2);
  }
  .k-chip.is-on { border-color: var(--brand); background: var(--brandSoft); color: var(--brandInk); font-weight: 600; box-shadow: 0 0 0 1px var(--brand) inset; }

  /* 商品清单 */
  .k-goods { padding: 4px 0; }
  .k-g { display: flex; gap: 10px; padding: 10px 14px; align-items: center; }
  .k-g .thumb { width: 52px; height: 52px; border-radius: 9px; }
  .k-g .thumb svg { width: 48%; height: 48%; }
  .k-g .nm { flex: 1; min-width: 0; }
  .k-g .nm b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-g .nm small { font-size: 11px; color: var(--ink3); }
  .k-g .qty { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .k-g .amt { width: 62px; text-align: right; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .k-more {
    width: 100%; padding: 10px 0 12px;
    font-size: 12.5px; color: var(--ink3);
    border-top: 1px solid var(--line2);
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .k-more svg { width: 13px; height: 13px; }

  /* 备注 */
  .k-note { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .k-note input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 13px;
  }
  .k-note input::placeholder { color: var(--ink4); }

  /* 支付方式 */
  .k-pay { display: flex; align-items: center; gap: 10px; padding: 13px 14px; }
  .k-pay + .k-pay { border-top: 1px solid var(--line2); }
  .k-pay .ico {
    width: 26px; height: 26px; border-radius: 7px;
    display: grid; place-items: center;
    background: #07c160; color: #fff;
  }
  .k-pay .ico svg { width: 17px; height: 17px; }
  .k-pay .ico--gray { background: #c9c0b8; }
  .k-pay .nm { flex: 1; font-size: 13.5px; }
  .k-pay .nm small { display: block; font-size: 11px; color: var(--ink3); }
  .k-pay .rd {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid var(--ink4);
    display: grid; place-items: center;
  }
  .k-pay .rd svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
  .k-pay.is-on .rd { background: var(--brand); border-color: var(--brand); }
  .k-pay.is-on .rd svg { opacity: 1; }
  .k-pay.is-off { opacity: .55; pointer-events: none; }

  /* 金额 */
  .k-sum { padding: 6px 0 10px; }
  .k-sum .cell { min-height: 38px; padding: 8px 14px; }
  .k-sum .cell-label { color: var(--ink3); font-size: 13px; }
  .k-sum .cell-value { font-size: 13px; }
  .k-sum .minus { color: var(--brandInk); }
  .k-sum .total-row { border-top: 1px solid var(--line2); margin-top: 4px; }
  .k-sum .total-row .cell-value { font-weight: 700; }

  .k-note-tip {
    margin: 10px 14px 16px;
    font-size: 11.5px;
    color: var(--ink3);
    line-height: 1.7;
    text-align: center;
  }

  /* 选券面板 */
  .cpopt {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line2);
  }
  .cpopt:last-child { border-bottom: 0; }
  .cpopt .amt {
    flex: 0 0 74px;
    text-align: center;
    font-size: 17px; font-weight: 700;
    color: var(--brandInk);
    font-variant-numeric: tabular-nums;
  }
  .cpopt .amt small { font-size: 11px; }
  .cpopt .tx { flex: 1; min-width: 0; }
  .cpopt .tx b { display: block; font-size: 13px; font-weight: 600; }
  .cpopt .tx small { font-size: 11px; color: var(--ink3); }
  .cpopt .rd {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid var(--ink4);
    display: grid; place-items: center;
  }
  .cpopt .rd svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
  .cpopt.is-on .rd { background: var(--brand); border-color: var(--brand); }
  .cpopt.is-on .rd svg { opacity: 1; }
  .cpopt-none { padding: 12px 0 4px; font-size: 13px; color: var(--ink3); text-align: center; }
</style>
</head>
<body>
<div class="mp">
  <nav class="nav nav--solid">
    <button class="nav-btn" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">确认订单</div>
    <div class="nav-side"></div>
  </nav>

  <main class="mp-main" id="scroller">
    <div class="k-switch" id="sw">
      <button data-mode="pickup" class="is-on" id="tabPickup">到店自取</button>
      <button data-mode="delivery" id="tabDelivery">配送到家</button>
    </div>

    <div class="card k-card" id="addrCard"></div>

    <div class="card k-card">
      <div class="k-goods" id="goods"></div>
    </div>

    <div class="card k-card">
      <div class="k-note">
        <span style="font-size:13.5px;color:var(--ink2);flex:0 0 auto">备注</span>
        <input id="remark" maxlength="40" placeholder="口味、忌口、餐具需求（选填）">
      </div>
    </div>

    <div class="card k-card">
      <div class="cell" id="cpRow">
        <span class="cell-label">优惠券</span>
        <span class="cell-value" id="cpVal">暂无可用</span>
        <span class="cell-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></span>
      </div>
    </div>

    <div class="sec" style="padding-bottom:6px"><span class="sec-t">支付方式</span></div>
    <div class="card k-card" style="margin-top:0">
      <div class="k-pay is-on" data-pay="微信支付">
        <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 4C4.9 4 1.8 6.6 1.8 9.8c0 1.8 1 3.4 2.6 4.5l-.6 1.9 2.2-1.1c.8.2 1.6.4 2.4.4h.6a5.5 5.5 0 0 1-.2-1.5c0-3.1 3-5.7 6.7-5.7h.6C15.5 5.6 12.4 4 8.7 4Zm-2.3 2.6a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Zm4.7 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8Z"/><path d="M22.2 14c0-2.7-2.7-4.9-5.9-4.9s-5.9 2.2-5.9 4.9 2.7 4.9 5.9 4.9c.7 0 1.4-.1 2-.3l1.8.9-.5-1.6c1.6-.9 2.6-2.3 2.6-3.9Zm-7.8-1.3a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm3.9 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg></span>
        <span class="nm">微信支付<small>推荐使用，秒到账</small></span>
        <span class="rd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      </div>
      <div class="k-pay is-off">
        <span class="ico ico--gray"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5V9H3V7.5Z"/><path d="M3 10.6h18v6A2.4 2.4 0 0 1 18.6 19H5.4A2.4 2.4 0 0 1 3 16.6v-6Z"/></svg></span>
        <span class="nm">储值余额<small>余额 ¥0.00 · 后续版本开放</small></span>
        <span class="rd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      </div>
    </div>

    <div class="sec" style="padding-bottom:6px"><span class="sec-t">金额明细</span></div>
    <div class="card k-card" style="margin-top:0">
      <div class="k-sum" id="sum"></div>
    </div>

    <p class="k-note-tip">这是功能演示环境，不会产生真实支付。<br>正式项目接入微信支付需商户号与后端签名。</p>
  </main>

  <div class="bar">
    <div style="flex:1">
      <div class="small muted">实付</div>
      <span class="price price--lg" id="payTotal"><i>¥</i><b>0</b></span>
    </div>
    <button class="btn btn--primary" id="submit" style="min-width:132px">提交订单</button>
  </div>

  <div class="mask" id="cpMask" hidden></div>
  <div class="sheet" id="cpSheet"></div>
</div>

<script src="../_shared/data.js"></script>
<script src="../_shared/demo.js"></script>
<script>
(function () {
  const all = QY.cart.list();
  const keys = QY.store.get('checkoutKeys', null);
  const items = (keys && keys.length) ? all.filter(i => keys.includes(i.key)) : all;

  if (!items.length) {
    document.querySelector('.mp-main').innerHTML = `<div class="empty" style="padding-top:78px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 3.6h2.2l2.5 10.1a1.8 1.8 0 0 0 1.75 1.37h8.1a1.8 1.8 0 0 0 1.75-1.33l1.5-5.6H6.2"/><circle cx="9.4" cy="19.6" r="1.4"/><circle cx="17.4" cy="19.6" r="1.4"/></svg>
      <div class="empty-t">购物车是空的</div>
      <div class="empty-s">先去挑一件，再来结算</div>
      <a class="btn btn--primary btn--sm" href="home.html#menu" style="margin-top:16px">去点餐</a>
    </div>`;
    document.querySelector('.bar').style.display = 'none';
    return;
  }

  let mode = 'pickup';
  let pickupTime = '尽快（约 15 分钟）';
  let payMethod = '微信支付';
  let couponId = null;

  const count = items.reduce((n, i) => n + i.qty, 0);
  const goods = items.reduce((n, i) => n + i.unit * i.qty, 0);
  const pack = PROMO.pack;
  const promo = goods >= PROMO.threshold ? PROMO.minus : 0;

  /* 行业履约方式：非零售/餐饮 不提供配送 */
  document.getElementById('tabPickup').textContent = MODE_WORD;
  if (!CAN_DELIVER) document.getElementById('tabDelivery').style.display = 'none';

  function deliveryFee() {
    if (mode !== 'delivery') return 0;
    return goods >= PROMO.freeAt ? 0 : PROMO.delivery;
  }
  function couponOf() {
    if (!couponId) return null;
    const c = QY.coupons.mine().find(x => x.id === couponId);
    if (!c || c.used) return null;
    const t = COUPONS.find(x => x.id === couponId);
    if (!t || t.min > goods) return null;
    return { c, t };
  }
  function couponCut() {
    const o = couponOf();
    if (!o) return 0;
    if (o.t.type === 'off') return Math.round(goods * (1 - o.t.v / 10) * 100) / 100;
    if (o.t.type === 'ship') return deliveryFee();
    return Math.min(o.t.v, goods);
  }
  function total() { return Math.max(0, goods + pack + deliveryFee() - promo - couponCut()); }

  /* 地址 / 门店卡 */
  function renderAddr() {
    const el = document.getElementById('addrCard');
    if (mode === 'pickup') {
      el.innerHTML = `
        <div class="k-addr">
          <span class="pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4c-4 0-7.2 3-7.2 6.8 0 5.1 7.2 12.4 7.2 12.4s7.2-7.3 7.2-12.4c0-3.8-3.2-6.8-7.2-6.8Zm0 9.4a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="who">${QY.esc(SHOP.name)} ${QY.esc(SHOP.branch)}<span>${PROMO.pack > 0 ? "免打包费" : QY.esc(MODE_WORD)}</span></div>
            <div class="where">${SHOP.address}</div>
          </div>
          <span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></span>
        </div>
        <div class="k-time">
          <div class="h"><span>预计到店时间</span><span class="muted">当前排队 3 单</span></div>
          <div class="k-chips" id="times">
            ${['尽快（约 15 分钟）', '12:30', '13:00'].map(t =>
        `<button class="k-chip${t === pickupTime ? ' is-on' : ''}" data-t="${t}">${t}</button>`).join('')}
          </div>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="k-addr">
          <span class="pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4c-4 0-7.2 3-7.2 6.8 0 5.1 7.2 12.4 7.2 12.4s7.2-7.3 7.2-12.4c0-3.8-3.2-6.8-7.2-6.8Zm0 9.4a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Z"/></svg></span>
          <div style="flex:1;min-width:0">
            <div class="who">${ADDRESS.name}<span>${ADDRESS.phone}</span></div>
            <div class="where">${ADDRESS.detail}</div>
          </div>
          <span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></span>
        </div>
        <div class="k-time">
          <div class="h"><span>预计送达</span><span class="muted">约 30–40 分钟</span></div>
          <div class="k-chips">
            <button class="k-chip is-on">尽快送达</button>
            <button class="k-chip">预约 12:30</button>
          </div>
        </div>`;
    }
  }

  /* 商品清单 */
  function renderGoods(limit) {
    const show = limit || items.length;
    const visible = items.slice(0, show);
    document.getElementById('goods').innerHTML =
      visible.map(i => `
        <div class="k-g">
          <div class="thumb ${i.cls}"><svg viewBox="0 0 24 24" fill="currentColor">${ICO[i.ico] || ICO.bowl}</svg></div>
          <div class="nm"><b>${QY.esc(i.name)}</b><small>${QY.esc(i.specText)}</small></div>
          <span class="qty">×${i.qty}</span>
          <span class="amt">¥${QY.money(i.unit * i.qty)}</span>
        </div>`).join('') +
      (items.length > show
        ? `<button class="k-more" id="moreBtn">展开全部 ${items.length} 件
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>`
        : '');
  }

  /* 金额 */
  function renderSum() {
    const df = deliveryFee();
    const cut = couponCut();
    const o = couponOf();
    document.getElementById('sum').innerHTML = `
      <div class="cell"><span class="cell-label">商品金额（${count} 件）</span><span class="cell-value num">¥${QY.money(goods)}</span></div>
      ${pack ? `<div class="cell"><span class="cell-label">打包费</span><span class="cell-value num">¥${QY.money(pack)}</span></div>` : ''}
      ${mode === 'delivery'
        ? `<div class="cell"><span class="cell-label">配送费</span><span class="cell-value num">${df ? '¥' + QY.money(df) : '<span class="muted">已免配送费</span>'}</span></div>`
        : ''}
      ${PROMO.minus ? `<div class="cell"><span class="cell-label">满 ${PROMO.threshold} 减 ${PROMO.minus}</span><span class="cell-value num minus">${promo ? '-¥' + QY.money(promo) : '<span class="muted">未达标</span>'}</span></div>` : ''}
      <div class="cell"><span class="cell-label">优惠券</span><span class="cell-value num minus">${cut ? '-¥' + QY.money(cut) : '<span class="muted">未使用</span>'}</span></div>
      <div class="cell total-row"><span class="cell-label" style="color:var(--ink);font-weight:600">合计</span><span class="cell-value num" style="font-size:15px">¥${QY.money(total())}</span></div>`;
    document.getElementById('payTotal').innerHTML = `<i>¥</i><b>${QY.money(total())}</b>`;
    document.getElementById('cpVal').innerHTML = o
      ? `<span style="color:var(--brandInk);font-weight:600">${QY.esc(o.t.t)} · -¥${QY.money(cut)}</span>`
      : (QY.coupons.usable(goods).length
        ? `<span style="color:var(--brandInk)">${QY.coupons.usable(goods).length} 张可用</span>`
        : '<span class="muted">暂无可用</span>');
  }

  /* 选券面板 */
  function openSheet() {
    const list = QY.coupons.usable(goods);
    const all = QY.coupons.mine().filter(c => !c.used);
    const sheet = document.getElementById('cpSheet');
    const mask = document.getElementById('cpMask');

    sheet.innerHTML = `<div class="sheet-t">选择优惠券</div>` + (
      all.length ? all.map(c => {
        const t = COUPONS.find(x => x.id === c.id);
        if (!t) return '';
        const ok = list.some(x => x.id === c.id);
        const off = t.type === 'off' ? `${t.v}<small>折</small>` : `¥${t.v}`;
        return `<div class="cpopt ${couponId === c.id ? 'is-on' : ''}" data-pick="${ok ? c.id : ''}">
          <div class="amt">${off}</div>
          <div class="tx">
            <b>${QY.esc(t.t)}</b>
            <small>${t.min ? '满 ' + t.min + ' 元可用' : '无门槛'}${ok ? '' : ' · 本单未达标'}</small>
          </div>
          <div class="rd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        </div>`;
      }).join('') + `<div class="cpopt" data-pick=""><div class="amt" style="font-size:13px;color:var(--ink3)">不使用</div><div class="tx"><b style="color:var(--ink3);font-weight:400">保留券下次再用</b></div><div class="rd"></div></div>`
        : '<div class="cpopt-none">还没有优惠券，去「我的 → 优惠券」领取</div>'
    );

    mask.hidden = false;
    requestAnimationFrame(() => { mask.classList.add('is-on'); sheet.classList.add('is-on'); });
  }
  function closeSheet() {
    const sheet = document.getElementById('cpSheet');
    const mask = document.getElementById('cpMask');
    mask.classList.remove('is-on');
    sheet.classList.remove('is-on');
    setTimeout(() => { mask.hidden = true; }, 240);
  }

  document.getElementById('cpRow').addEventListener('click', openSheet);
  document.getElementById('cpMask').addEventListener('click', closeSheet);
  document.getElementById('cpSheet').addEventListener('click', e => {
    const p = e.target.closest('[data-pick]');
    if (!p) return;
    couponId = p.dataset.pick || null;
    closeSheet();
    renderSum();
  });

  /* 交互 */
  document.getElementById('sw').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    e.currentTarget.querySelectorAll('button').forEach(x => x.classList.toggle('is-on', x === b));
    mode = b.dataset.mode;
    renderAddr();
    renderSum();
  });

  document.getElementById('addrCard').addEventListener('click', e => {
    const t = e.target.closest('[data-t]');
    if (t) {
      pickupTime = t.dataset.t;
      document.querySelectorAll('#times .k-chip').forEach(x => x.classList.toggle('is-on', x === t));
    }
  });

  document.getElementById('goods').addEventListener('click', e => {
    if (e.target.closest('#moreBtn')) renderGoods(items.length);
  });

  document.querySelectorAll('.k-pay').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('is-off')) return;
      document.querySelectorAll('.k-pay').forEach(x => x.classList.remove('is-on'));
      el.classList.add('is-on');
      payMethod = el.dataset.pay;
    });
  });

  document.getElementById('submit').addEventListener('click', () => {
    const btn = document.getElementById('submit');
    btn.disabled = true;
    btn.textContent = '支付中…';
    QY.paySim(() => {
      const order = QY.orders.create({
        items: items.map(i => ({
          name: i.name, specText: i.specText, qty: i.qty,
          unit: i.unit, ico: i.ico, cls: i.cls
        })),
        goods, pack, delivery: deliveryFee(), promo, total: total(),
        couponCut: couponCut(), couponName: couponOf() ? couponOf().t.t : '',
        mode, pickupTime: mode === 'pickup' ? pickupTime : '尽快送达',
        addr: mode === 'pickup' ? SHOP.address : ADDRESS.detail,
        remark: document.getElementById('remark').value.trim(),
        payMethod,
        status: 'paid', statusText: mode === 'pickup' ? '已支付 · 制作中' : '已支付 · 备餐中'
      });
      // 已下单的从购物车移除
      items.forEach(i => QY.cart.remove(i.key));
      if (couponId) QY.coupons.use(couponId);
      QY.store.del('checkoutKeys');
      location.href = 'success.html?no=' + order.no;
    });
  });

  renderAddr();
  renderGoods(3);
  renderSum();
})();
</script>
</body>
</html>
