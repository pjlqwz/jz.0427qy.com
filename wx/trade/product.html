<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>商品详情 · 拾光小馆</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .p-hero {
    position: relative;
    height: 292px;
    overflow: hidden;
  }
  .p-hero .thumb--lg { position: absolute; inset: 0; }
  .p-hero .thumb--lg svg { width: 34%; height: 34%; opacity: .66; }
  .p-hero-tag {
    position: absolute;
    left: 16px; bottom: 34px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, .78);
    text-transform: uppercase;
  }
  .p-body {
    position: relative;
    margin-top: -22px;
    border-radius: 20px 20px 0 0;
    background: var(--bg);
    padding-bottom: 8px;
  }
  .p-head {
    background: #fff;
    margin: 0 0 10px;
    padding: 16px 16px 13px;
    border-radius: 20px 20px 14px 14px;
    box-shadow: var(--sh);
  }
  .p-name { font-size: 20px; font-weight: 700; letter-spacing: .3px; line-height: 1.32; }
  .p-sub { margin-top: 5px; font-size: 12.5px; color: var(--ink3); }
  .p-tags { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
  .p-price-row {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-top: 13px; padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .p-price-row .rr { text-align: right; font-size: 11px; color: var(--ink3); line-height: 1.6; }

  /* 规格 */
  .p-spec { padding: 14px 16px 4px; }
  .p-spec + .p-spec { border-top: 1px solid var(--line2); }
  .p-spec-h { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .p-spec-h b { font-size: 13.5px; font-weight: 600; }
  .p-spec-h span { font-size: 11px; color: var(--ink4); }
  .p-opts { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
  .p-opt {
    height: 32px;
    padding: 0 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #fdfbf9;
    color: var(--ink2);
    font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px;
    transition: all .16s ease;
  }
  .p-opt em { font-style: normal; font-size: 11px; color: var(--brandInk); }
  .p-opt.is-on {
    border-color: var(--brand);
    background: var(--brandSoft);
    color: var(--brandInk);
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--brand) inset;
  }
  .p-opt:active { transform: scale(.97); }

  /* 介绍 */
  .p-desc { padding: 14px 16px 10px; font-size: 13px; line-height: 1.75; color: var(--ink2); }
  .p-mat { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px; }
  .p-mat span {
    font-size: 11.5px; color: var(--ink2);
    background: #f4efe9; border-radius: 6px;
    padding: 4px 9px;
  }
  .p-rv { padding: 13px 16px; }
  .p-rv + .p-rv { border-top: 1px solid var(--line2); }
  .p-rv-h { display: flex; align-items: center; gap: 7px; }
  .p-av {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: #f3ece5; font-size: 10px; font-weight: 600; color: var(--ink2);
  }
  .p-stars { color: #e9a13c; font-size: 11px; letter-spacing: 1px; }
  .p-rv p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink2); }

  .p-bar .icon-btn[disabled] { opacity: .4; }
</style>
</head>
<body>
<div class="mp">
  <nav class="nav nav--float">
    <button class="nav-btn" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
    </button>
    <div class="nav-title"></div>
    <div class="nav-side">
      <button class="nav-btn" id="shareBtn" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5.4" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.6" r="2.6"/><path d="m8.4 10.8 7.3-4M8.4 13.2l7.3 4"/></svg>
      </button>
    </div>
  </nav>

  <main class="mp-main" id="scroller">
    <div class="p-hero" id="hero"></div>

    <div class="p-body">
      <div class="p-head" id="head"></div>
      <div class="card" id="specs" style="margin:0 0 10px"></div>

      <div class="sec" style="padding-top:6px;padding-bottom:8px"><span class="sec-t">商品介绍</span></div>
      <div class="card" style="margin:0 0 10px">
        <div class="p-desc" id="desc"></div>
        <div class="p-mat" id="mat"></div>
      </div>

      <div class="sec" style="padding-top:6px;padding-bottom:8px"><span class="sec-t">评价</span><span class="sec-s" id="rvCount"></span></div>
      <div class="card" id="reviews" style="margin:0 0 10px"></div>

      <div class="sec" style="padding-top:6px;padding-bottom:8px"><span class="sec-t">服务保障</span></div>
      <div class="card" style="margin:0 0 16px">
        <div class="cell"><span class="cell-label">明码标价</span><span class="cell-value muted">页面价格即成交价，不临时加收</span></div>
        <div class="cell"><span class="cell-label">服务承诺</span><span class="cell-value muted">不满意当场重做或全额退款</span></div>
        <div class="cell"><span class="cell-label">售后保障</span><span class="cell-value muted">30 天内出现问题免费处理</span></div>
      </div>
    </div>
  </main>

  <div class="bar p-bar">
    <button class="icon-btn" id="csBtn" aria-label="客服">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12.6a8.4 8.4 0 1 1-3.2-6.6"/><path d="M4 10.4v3.6a2 2 0 0 0 2 2h.6a1 1 0 0 0 1-1v-3.6a1 1 0 0 0-1-1H4Z"/><path d="M20.4 11.2h-1.2a1 1 0 0 0-1 1v3.4a1 1 0 0 0 1 1h.6a1 1 0 0 0 1-1v-1.4"/></svg>
    </button>
    <a class="icon-btn" href="cart.html" aria-label="购物车">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 3.6h2.2l2.5 10.1a1.8 1.8 0 0 0 1.75 1.37h8.1a1.8 1.8 0 0 0 1.75-1.33l1.5-5.6H6.2"/><circle cx="9.4" cy="19.6" r="1.5" fill="currentColor"/><circle cx="17.4" cy="19.6" r="1.5" fill="currentColor"/></svg>
      <i class="tab-badge" data-badge hidden style="top:2px;margin-left:6px">0</i>
    </a>
    <button class="btn btn--soft" id="addBtn" style="flex:1">加入购物车</button>
    <button class="btn btn--primary" id="buyBtn" style="flex:1.1">立即购买</button>
  </div>
</div>

<script src="../_shared/data.js"></script>
<script src="../_shared/demo.js"></script>
<script>
(function () {
  const p = QY.product(QY.qs('id')) || PRODUCTS[0];

  /* 头图 */
  const catName = (CATS.find(c => c.id === p.cat) || {}).name || '';
  document.getElementById('hero').innerHTML =
    `<div class="thumb thumb--lg ${p.cls}"><svg viewBox="0 0 24 24" fill="currentColor">${ICO[p.ico]}</svg></div>
     <span class="p-hero-tag">${QY.esc(SHOP.name)} · ${QY.esc(catName)}</span>`;

  /* 头部 */
  document.getElementById('head').innerHTML = `
    <div class="p-name">${QY.esc(p.name)}</div>
    <div class="p-sub">${QY.esc(p.sub)}</div>
    <div class="p-tags">${p.tags.map((t, i) => `<span class="tag${i ? ' tag--gold' : ''}">${QY.esc(t)}</span>`).join('')}</div>
    <div class="p-price-row">
      <div>
        <span class="price price--lg" id="priceMain"><i>¥</i><b>${p.price}</b></span>
        ${p.oldPrice ? `<span class="price-old">¥${p.oldPrice}</span>` : ''}
      </div>
      <div class="rr">
        <div>月售 ${p.sales} · 评分 ${p.rating}</div>
        <div>${p.specs.length} 项可选规格</div>
      </div>
    </div>`;

  /* 规格 */
  const sel = {};
  p.specs.forEach(s => { sel[s.name] = s.opts[0].label; });

  document.getElementById('specs').innerHTML = p.specs.map(s => `
    <div class="p-spec">
      <div class="p-spec-h"><b>${s.name}</b><span>必选</span></div>
      <div class="p-opts" data-spec="${s.name}">
        ${s.opts.map((o, i) => `<button class="p-opt${i === 0 ? ' is-on' : ''}" data-opt="${o.label}">
          ${o.label}${o.delta ? `<em>+${o.delta}</em>` : ''}</button>`).join('')}
      </div>
    </div>`).join('');

  function unitPrice() {
    let v = p.price;
    p.specs.forEach(s => {
      const o = s.opts.find(x => x.label === sel[s.name]);
      if (o && o.delta) v += o.delta;
    });
    return v;
  }
  function paintPrice() {
    document.getElementById('priceMain').innerHTML = `<i>¥</i><b>${QY.money(unitPrice())}</b>`;
  }

  document.getElementById('specs').addEventListener('click', e => {
    const b = e.target.closest('[data-opt]');
    if (!b) return;
    const box = b.closest('[data-spec]');
    box.querySelectorAll('.p-opt').forEach(x => x.classList.toggle('is-on', x === b));
    sel[box.dataset.spec] = b.dataset.opt;
    paintPrice();
  });

  /* 介绍 */
  document.getElementById('desc').textContent = p.desc;
  document.getElementById('mat').innerHTML = p.materials.map(m => `<span>${QY.esc(m)}</span>`).join('');

  /* 评价 */
  document.getElementById('rvCount').textContent = `${p.rating} 分 · ${Math.round(p.sales * 0.62)} 条`;
  document.getElementById('reviews').innerHTML = REVIEWS.map(r => `
    <div class="p-rv">
      <div class="p-rv-h">
        <span class="p-av">${QY.esc(r.name.slice(0, 1))}</span>
        <span class="p-stars">${'★'.repeat(r.stars)}</span>
        <span class="small muted" style="margin-left:auto">${r.date}</span>
      </div>
      <p>${QY.esc(r.text)}</p>
    </div>`).join('');

  /* 交互 */
  document.getElementById('addBtn').addEventListener('click', () => {
    QY.cart.add(p.id, sel);
    QY.toast('已加入购物车');
  });
  document.getElementById('buyBtn').addEventListener('click', () => {
    QY.cart.add(p.id, sel);
    location.href = 'checkout.html';
  });
  document.getElementById('csBtn').addEventListener('click', () =>
    QY.toast('客服已接入，这是演示环境', 1600));
  document.getElementById('shareBtn').addEventListener('click', () =>
    QY.toast('已生成分享卡片（演示）', 1600));

  paintPrice();
  QY.renderBadge();
})();
</script>
</body>
</html>
