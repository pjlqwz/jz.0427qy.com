<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>会员中心</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .m-head {
    position: relative;
    padding: 22px 16px 20px;
    color: #fff;
    overflow: hidden;
    background: linear-gradient(150deg, var(--brand2), var(--brand) 62%, var(--brandInk));
    border-radius: 0 0 20px 20px;
  }
  .m-head::after {
    content: "";
    position: absolute;
    width: 190px; height: 190px;
    right: -66px; top: -74px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
  }
  .m-user { position: relative; display: flex; align-items: center; gap: 12px; }
  .m-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .92);
    color: var(--brandInk);
    font-size: 20px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
  }
  .m-name { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .m-lv {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 5px;
    height: 20px; padding: 0 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .22);
    font-size: 11px; font-weight: 600;
    letter-spacing: .3px;
  }
  .m-lv svg { width: 11px; height: 11px; }
  .m-grow { position: relative; margin-top: 16px; }
  .m-grow .lb { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255, 255, 255, .72); }
  .m-grow .track {
    height: 6px; margin-top: 7px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .22);
    overflow: hidden;
  }
  .m-grow .track i {
    display: block; height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #fff, #ffe6d2);
    transition: width .6s cubic-bezier(.3, .8, .3, 1);
  }

  /* 资产三宫格 */
  .m-assets {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: -14px 14px 0;
    padding: 15px 0 14px;
    background: #fff;
    border-radius: var(--r);
    box-shadow: var(--sh);
    text-align: center;
  }
  .m-assets a { text-decoration: none; color: inherit; }
  .m-assets a + a { border-left: 1px solid var(--line2); }
  .m-assets b {
    display: block;
    font-size: 20px; font-weight: 700;
    letter-spacing: -.4px;
    font-variant-numeric: tabular-nums;
  }
  .m-assets span { font-size: 11px; color: var(--ink3); }

  /* 订单四宫格 */
  .m-orders {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 4px 0 12px;
  }
  .m-orders a {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink2); font-size: 11.5px;
    padding: 8px 0;
  }
  .m-orders a:active { opacity: .6; }
  .m-orders svg { width: 23px; height: 23px; color: var(--ink2); }

  /* 功能宫格 */
  .m-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 6px 0 14px;
  }
  .m-grid a {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    text-decoration: none; color: var(--ink2); font-size: 11.5px;
    padding: 8px 0;
  }
  .m-grid .gi {
    width: 40px; height: 40px;
    border-radius: 13px;
    display: grid; place-items: center;
    background: var(--brandSoft);
    color: var(--brandInk);
  }
  .m-grid .gi svg { width: 21px; height: 21px; }
  .m-grid a:active .gi { transform: scale(.94); }

  /* 权益 */
  .m-right { padding: 0 14px 12px; }
  .m-right .r {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 0;
    font-size: 12.5px;
    color: var(--ink2);
  }
  .m-right .r:not(:last-child) { border-bottom: 1px solid var(--line2); }
  .m-right .r svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--brand); }
  .m-right .r .cur {
    margin-left: auto;
    font-size: 11px;
    color: #227d54;
    background: var(--greenSoft);
    padding: 1px 7px;
    border-radius: 4px;
  }
  .m-right .r .next {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink3);
  }
</style>
</head>
<body>
<div class="mp">
  <main class="mp-main">
    <div class="m-head">
      <div class="m-user">
        <div class="m-avatar">左</div>
        <div style="flex:1;min-width:0">
          <div class="m-name">左先生</div>
          <span class="m-lv" id="lvBadge"></span>
        </div>
      </div>
      <div class="m-grow">
        <div class="lb"><span id="growLb">成长值</span><span id="growNum"></span></div>
        <div class="track"><i id="growBar" style="width:0"></i></div>
      </div>
    </div>

    <div class="m-assets">
      <a href="coupon.html"><b id="aCoupon">0</b><span>优惠券</span></a>
      <a href="signin.html"><b id="aPoints">0</b><span>积分</span></a>
      <a href="signin.html"><b id="aStreak">0</b><span>连签天数</span></a>
    </div>

    <div class="sec" style="padding-bottom:2px"><span class="sec-t">我的订单</span><a class="sec-s" href="../trade/order.html" style="text-decoration:none">全部 ›</a></div>
    <div class="card" style="margin:0 14px">
      <div class="m-orders">
        <a href="../trade/order.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h18M3 12h18M3 17.5h11"/></svg>
          全部
        </a>
        <a href="../trade/order.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3.2 2"/></svg>
          进行中
        </a>
        <a href="../trade/order.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
          已完成
        </a>
        <a href="coupon.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 9.2A2 2 0 0 1 5 6.2h14a2 2 0 0 1 1.6 3M3.4 14.8A2 2 0 0 0 5 17.8h14a2 2 0 0 0 1.6-3"/><path d="M9 6.2v11.6" stroke-dasharray="2 2.4"/></svg>
          优惠券
        </a>
      </div>
    </div>

    <div class="sec" style="padding-bottom:2px"><span class="sec-t">常用功能</span></div>
    <div class="card" style="margin:0 14px">
      <div class="m-grid">
        <a href="signin.html">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="5" width="17.2" height="16" rx="2.4"/><path d="M8 3v4M16 3v4M3.4 10h17.2"/><path d="m9.6 15.2 1.8 1.8 3.2-3.4"/></svg></span>
          每日签到
        </a>
        <a href="../promo/lottery.html">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 3.4v8.6l6 4.2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>
          幸运抽奖
        </a>
        <a href="../service/booking.html">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="5" width="17.2" height="16" rx="2.4"/><path d="M8 3v4M16 3v4M3.4 10h17.2M8.6 14.6h6.8"/></svg></span>
          我的预约
        </a>
        <a href="../service/contact.html">
          <span class="gi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.4c0 4-3.9 7.2-8.6 7.2-1 0-2-.1-2.9-.4L4 21l1.5-3.6A6.8 6.8 0 0 1 3.4 12.4c0-4 3.9-7.2 8.6-7.2s8.6 3.2 8.6 7.2Z"/></svg></span>
          联系客服
        </a>
      </div>
    </div>

    <div class="sec" style="padding-bottom:8px"><span class="sec-t">等级权益</span><span class="sec-s" id="rightTip"></span></div>
    <div class="card" style="margin:0 14px 16px">
      <div class="m-right" id="rights"></div>
    </div>
  </main>
  <nav id="tabbar"></nav>
</div>

<script src="../_shared/data.js"></script>
<script src="../_shared/demo.js"></script>
<script>
(function () {
  const m = QY.member.get();
  const cur = QY.member.levelOf(m.growth);
  const idx = MEMBER.levels.findIndex(l => l.name === cur.name);
  const next = MEMBER.levels[idx + 1];

  document.getElementById('lvBadge').innerHTML =
    `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.5 5.4 5.9.8-4.3 4.1 1.1 5.8L12 15.9l-5.2 2.8 1.1-5.8-4.3-4.1 5.9-.8L12 2.6Z"/></svg>${cur.name}`;

  const span = next ? (next.need - cur.need) : 1;
  const done = next ? Math.max(0, m.growth - cur.need) : 1;
  document.getElementById('growBar').style.width = Math.min(100, Math.round(done / span * 100)) + '%';
  document.getElementById('growNum').textContent = next
    ? `${m.growth} / ${next.need}`
    : `${m.growth}（已满级）`;
  document.getElementById('growLb').textContent = next
    ? `再消费 ${Math.max(0, next.need - m.growth)} 元升级 ${next.name}`
    : '已达最高等级';

  document.getElementById('aPoints').textContent = m.points;
  document.getElementById('aStreak').textContent = m.streak || 0;
  document.getElementById('aCoupon').textContent = QY.coupons.mine().filter(c => !c.used).length;

  const ticks = [
    { t: '消费积分（1 元 = 1 分）', on: true },
    { t: '会员专享折扣', on: idx >= 1 },
    { t: '生日礼 / 专属客服', on: idx >= 2 },
    { t: '优先取餐 / 免排队', on: idx >= 2 }
  ];
  document.getElementById('rights').innerHTML = ticks.map(x => `
    <div class="r">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      <span>${x.t}</span>
      ${x.on ? '<span class="cur">已享有</span>' : '<span class="next">升级解锁</span>'}
    </div>`).join('');

  document.getElementById('rightTip').textContent = next
    ? `距 ${next.name} 还差 ${Math.max(0, next.need - m.growth)} 成长值`
    : '已是最高等级';

  QY.tabbar('mine');
})();
</script>
</body>
</html>
