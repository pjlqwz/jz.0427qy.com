<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>限时秒杀</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .k-top {
    padding: 16px 14px 22px;
    color: #fff;
    background:
      radial-gradient(120% 90% at 86% -10%, rgba(255, 255, 255, .18), transparent 58%),
      linear-gradient(150deg, #3a2c22, #2a2019 62%, #1e1712);
    border-radius: 0 0 20px 20px;
  }
  .k-top h1 { margin: 0 0 12px; font-size: 18px; font-weight: 700; letter-spacing: .6px; }
  .k-top h1 span { font-size: 11px; font-weight: 500; color: rgba(255, 255, 255, .55); margin-left: 7px; letter-spacing: 0; }
  .k-sess { display: flex; gap: 6px; }
  .k-sess button {
    flex: 1;
    padding: 7px 0 8px;
    border-radius: 9px;
    background: rgba(255, 255, 255, .08);
    color: rgba(255, 255, 255, .62);
    font-size: 12.5px;
    transition: all .18s ease;
  }
  .k-sess button b { display: block; font-size: 13.5px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .k-sess button small { font-size: 10px; }
  .k-sess button.is-on {
    background: linear-gradient(140deg, var(--brand2), var(--brand));
    color: #fff;
    box-shadow: 0 5px 14px rgba(224, 99, 44, .3);
  }
  .k-cd {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 14px;
    font-size: 12px; color: rgba(255, 255, 255, .62);
  }
  .k-cd .b {
    min-width: 26px; padding: 2px 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, .14);
    color: #fff; font-size: 14px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  /* 商品 */
  .k-item { margin: 10px 14px 0; overflow: hidden; }
  .k-row { display: flex; gap: 11px; padding: 12px 14px; }
  .k-row .thumb { width: 82px; height: 82px; }
  .k-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .k-nm { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-sb { margin-top: 3px; font-size: 11.5px; color: var(--ink3); }
  .k-bar { margin-top: 9px; display: flex; align-items: center; gap: 8px; }
  .k-track {
    flex: 1; height: 13px;
    border-radius: 7px;
    background: #fbe3d4;
    overflow: hidden;
    position: relative;
  }
  .k-track i {
    display: block; height: 100%;
    border-radius: 7px;
    background: linear-gradient(90deg, #f2a05c, #e0632c);
    transition: width .5s cubic-bezier(.3, .8, .3, 1);
  }
  .k-track em {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 9.5px; font-style: normal;
    color: #8a3f16; font-weight: 600;
    letter-spacing: .2px;
  }
  .k-foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .k-tag {
    font-size: 9.5px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #e0632c, #c94a19);
    padding: 1px 5px; border-radius: 4px;
    margin-right: 5px;
  }
  .k-buy {
    flex: 0 0 auto;
    height: 30px; padding: 0 14px;
    border-radius: 999px;
    font-size: 12.5px; font-weight: 700;
    background: linear-gradient(135deg, var(--brand2), var(--brand));
    color: #fff;
    box-shadow: 0 3px 10px rgba(224, 99, 44, .28);
  }
  .k-buy:active { transform: scale(.96); }
  .k-buy[disabled] { background: #ddd4cb; box-shadow: none; color: #fff; }
  .k-buy.is-got { background: #f2ece6; color: var(--ink3); box-shadow: none; }

  .k-note { margin: 14px 16px 18px; font-size: 11px; line-height: 1.8; color: var(--ink4); }
</style>
</head>
<body>
<div class="mp">
  <nav class="nav nav--solid">
    <button class="nav-btn" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
    </button>
    <div class="nav-title">限时秒杀</div>
    <div class="nav-side"></div>
  </nav>

  <main class="mp-main">
    <div class="k-top">
      <h1>限时秒杀<span>整点开抢 · 售完即止</span></h1>
      <div class="k-sess" id="sess"></div>
      <div class="k-cd" id="cd"></div>
    </div>
    <div id="list"></div>
    <p class="k-note">页面为演示环境：场次时间、库存与价格均为虚构，不产生真实交易。</p>
  </main>

  <nav id="tabbar"></nav>
</div>

<script src="../_shared/data.js"></script>
<script src="../_shared/demo.js"></script>
<script>
(function () {
  const SESS = [
    { t: '10:00', label: '已开抢', state: 'past' },
    { t: '14:00', label: '抢购中', state: 'live' },
    { t: '20:00', label: '即将开始', state: 'soon' }
  ];
  let cur = 1;

  /* 每个场次 4 个商品，秒杀价 = 原价 * 0.55 */
  const data = SESS.map((s, si) => ({
    ...s,
    items: PRODUCTS.slice(si, si + 4).map((p, i) => ({
      pid: p.id, name: p.name, sub: p.sub, ico: p.ico, cls: p.cls,
      price: p.price,
      kprice: Math.max(1, Math.round(p.price * 0.55)),
      total: 100,
      sold: 58 + ((si * 4 + i) * 9) % 36,
      got: false,
      end: Date.now() + (si === 1 ? 107 : si === 2 ? 400 : -30) * 6e4
    }))
  }));

  function fmt(ms) {
    if (ms <= 0) return ['00', '00', '00'];
    const s = Math.floor(ms / 1000);
    return [
      String(Math.floor(s / 3600)).padStart(2, '0'),
      String(Math.floor((s % 3600) / 60)).padStart(2, '0'),
      String(s % 60).padStart(2, '0')
    ];
  }

  function renderSess() {
    document.getElementById('sess').innerHTML = SESS.map((s, i) =>
      `<button data-s="${i}" class="${i === cur ? 'is-on' : ''}">
        <b>${s.t}</b><small>${i === cur ? (s.state === 'live' ? '抢购中' : s.label) : s.label}</small>
      </button>`).join('');
  }

  function renderCD() {
    const s = data[cur];
    const [h, m, sec] = fmt(s.items[0].end - Date.now());
    const pre = s.state === 'soon' ? '距开始' : s.state === 'past' ? '本场已结束' : '距结束';
    document.getElementById('cd').innerHTML = s.state === 'past'
      ? `<span>${pre}</span>`
      : `<span>${pre}</span><span class="b">${h}</span>:<span class="b">${m}</span>:<span class="b">${sec}</span>`;
  }

  function renderList() {
    const s = data[cur];
    document.getElementById('list').innerHTML = s.items.map((it, i) => {
      const pct = Math.min(100, Math.round(it.sold / it.total * 100));
      const soldOut = pct >= 100;
      return `<div class="card k-item">
        <div class="k-row">
          <div class="thumb ${it.cls}"><svg viewBox="0 0 24 24" fill="currentColor">${ICO[it.ico] || ICO.bowl}</svg></div>
          <div class="k-mid">
            <div class="k-nm">${QY.esc(it.name)}</div>
            <div class="k-sb">${QY.esc(it.sub)}</div>
            <div class="k-bar">
              <div class="k-track">
                <i style="width:${pct}%"></i>
                <em>${soldOut ? '已抢光' : '已抢 ' + pct + '%'}</em>
              </div>
            </div>
            <div class="k-foot">
              <div>
                <span class="k-tag">秒杀</span>
                <span class="price"><i>¥</i><b>${it.kprice}</b></span>
                <span class="price-old">¥${it.price}</span>
              </div>
              <button class="k-buy ${it.got ? 'is-got' : ''}" data-buy="${i}"
                ${soldOut || s.state === 'soon' ? 'disabled' : ''}>
                ${soldOut ? '已抢光' : it.got ? '已抢到' : s.state === 'soon' ? '未开始' : '立即抢'}
              </button>
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('sess').addEventListener('click', e => {
    const b = e.target.closest('[data-s]');
    if (!b) return;
    cur = +b.dataset.s;
    renderSess(); renderCD(); renderList();
  });

  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('[data-buy]');
    if (!b || b.disabled) return;
    const it = data[cur].items[+b.dataset.buy];
    if (it.got) return;
    it.got = true;
    it.sold = Math.min(it.total, it.sold + 1);
    QY.toast('抢到了，去结算吧', 1500);
    renderList();
    // 抢到后 800ms 直接进购物车链路
    setTimeout(() => { QY.cart.add(it.pid); QY.renderBadge(); }, 700);
  });

  renderSess(); renderCD(); renderList();
  setInterval(renderCD, 1000);
  QY.tabbar('mine');
})();
</script>
</body>
</html>
