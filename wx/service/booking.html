<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>在线预约</title>
<link rel="stylesheet" href="../_shared/demo.css">
<style>
  .bk-sec { padding: 0 14px; }
  .bk-hint { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 2px 9px; }
  .bk-hint b { font-size: 14.5px; font-weight: 700; }
  .bk-hint span { font-size: 11.5px; color: var(--ink3); }

  /* 项目 */
  .bk-items { display: flex; flex-direction: column; gap: 8px; }
  .bk-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 13px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid transparent;
    box-shadow: var(--sh);
    transition: all .16s ease;
  }
  .bk-item .nm { flex: 1; font-size: 13.5px; font-weight: 600; }
  .bk-item .rd {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid var(--ink4);
    display: grid; place-items: center;
  }
  .bk-item .rd svg { width: 12px; height: 12px; color: #fff; opacity: 0; }
  .bk-item.is-on { border-color: var(--brand); background: var(--brandSoft); }
  .bk-item.is-on .rd { background: var(--brand); border-color: var(--brand); }
  .bk-item.is-on .rd svg { opacity: 1; }

  /* 日期 */
  .bk-days { display: flex; gap: 7px; overflow-x: auto; padding: 0 14px; scrollbar-width: none; }
  .bk-days::-webkit-scrollbar { display: none; }
  .bk-day {
    flex: 0 0 58px;
    padding: 9px 0 8px;
    border-radius: 11px;
    background: #fff;
    border: 1px solid var(--line);
    text-align: center;
    box-shadow: 0 1px 3px rgba(34, 29, 25, .04);
  }
  .bk-day .w { font-size: 10.5px; color: var(--ink3); }
  .bk-day .d { margin-top: 3px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bk-day .m { font-size: 9.5px; color: var(--ink4); margin-top: 1px; }
  .bk-day.is-on { background: linear-gradient(150deg, var(--brand2), var(--brand)); border-color: transparent; box-shadow: 0 4px 12px rgba(224, 99, 44, .28); }
  .bk-day.is-on .w, .bk-day.is-on .d, .bk-day.is-on .m { color: #fff; }

  /* 时段 */
  .bk-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; padding: 0 14px; }
  .bk-slot {
    height: 34px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--ink2);
    font-variant-numeric: tabular-nums;
  }
  .bk-slot.is-on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; box-shadow: 0 4px 10px rgba(224, 99, 44, .26); }
  .bk-slot.is-full { background: #f4f0eb; color: var(--ink4); text-decoration: line-through; pointer-events: none; }

  /* 表单行 */
  .bk-form { margin: 0 14px; }
  .bk-form .cell { min-height: 46px; }
  .bk-form input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13.5px; text-align: right; }
  .bk-form input::placeholder { color: var(--ink4); }

  /* 成功态 */
  .bk-ok { padding: 40px 20px 20px; text-align: center; }
  .bk-ok .ico {
    width: 64px; height: 64px; margin: 0 auto 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--greenSoft); color: var(--green);
  }
  .bk-ok .ico svg { width: 32px; height: 32px; }
  .bk-ok h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .bk-ok p { margin: 7px 0 0; font-size: 12.5px; color: var(--ink3); }
  .bk-ticket {
    margin: 20px 18px 0;
    padding: 16px;
    border-radius: 14px;
    background: #fff;
    box-shadow: var(--sh);
    text-align: left;
  }
  .bk-ticket .r { display: flex; font-size: 12.5px; padding: 6px 0; }
  .bk-ticket .r span { color: var(--ink3); width: 64px; flex: 0 0 auto; }
  .bk-ticket .r b { font-weight: 600; }
</style>
</head>
<body>
<div class="mp">
  <nav class="nav nav--solid">
    <button class="nav-btn" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5-7 7 7 7"/></svg>
    </button>
    <div class="nav-title" id="ttl">在线预约</div>
    <div class="nav-side"></div>
  </nav>

  <main class="mp-main" id="main">
    <div class="bk-hint" style="padding-left:16px;padding-right:16px">
      <div><b>选择项目</b></div>
      <span>单选</span>
    </div>
    <div class="bk-sec"><div class="bk-items" id="items"></div></div>

    <div class="bk-hint" style="padding-left:16px;padding-right:16px"><b>选择日期</b><span id="dayTip"></span></div>
    <div class="bk-days" id="days"></div>

    <div class="bk-hint" style="padding-left:16px;padding-right:16px"><b>选择时段</b><span>灰色为该时段已满</span></div>
    <div class="bk-slots" id="slots"></div>

    <div class="bk-hint" style="padding-left:16px;padding-right:16px"><b>到店人数</b><span>含本人</span></div>
    <div class="card" style="margin:0 14px">
      <div class="cell">
        <span class="cell-label">人数</span>
        <span class="cell-value" style="display:flex;justify-content:flex-end">
          <span class="stepper" id="people">
            <button data-p="-1" aria-label="减少"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
            <span id="peopleN">1</span>
            <button class="is-plus" data-p="1" aria-label="增加"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </span>
        </span>
      </div>
    </div>

    <div class="bk-hint" style="padding-left:16px;padding-right:16px"><b>联系方式</b><span>仅用于到店确认</span></div>
    <div class="card bk-form">
      <div class="cell"><span class="cell-label">姓名</span><input id="fName" maxlength="12" placeholder="请输入称呼" value="左先生"></div>
      <div class="cell"><span class="cell-label">手机号</span><input id="fPhone" maxlength="11" inputmode="numeric" placeholder="接收确认短信" value="18624274046"></div>
    </div>

    <div style="padding:18px 14px 22px">
      <button class="btn btn--primary btn--block" id="submit">提交预约</button>
    </div>
  </main>

  <nav id="tabbar"></nav>
</div>

<script src="../_shared/data.js"></script>
<script src="../_shared/demo.js"></script>
<script>
(function () {
  const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const ITEMS = BOOKING.items;
  const SLOTS = BOOKING.slots;

  let itemIdx = 0, dayOffset = 0, slot = '', people = 1;

  /* 日期：未来 7 天 */
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() + i);
    return { off: i, w: WK[d.getDay()], d: d.getDate(), m: d.getMonth() + 1, full: i === 0 };
  });

  /* 某些时段按日期固定占用，制造真实感 */
  const fullSet = (off) => {
    const base = [1, 5, 6, 3, 7, 2, 4];
    return new Set([base[off % 7], (base[off % 7] + 3) % SLOTS.length]);
  };

  function render() {
    document.getElementById('items').innerHTML = ITEMS.map((t, i) =>
      `<div class="bk-item ${i === itemIdx ? 'is-on' : ''}" data-item="${i}">
        <span class="nm">${QY.esc(t)}</span>
        <span class="rd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      </div>`).join('');

    document.getElementById('days').innerHTML = days.map(d =>
      `<button class="bk-day ${d.off === dayOffset ? 'is-on' : ''}" data-day="${d.off}">
        <div class="w">${d.off === 0 ? '今天' : d.w}</div>
        <div class="d">${d.d}</div>
        <div class="m">${d.m}月</div>
      </button>`).join('');

    document.getElementById('dayTip').textContent = dayOffset === 0 ? '今天剩余时段较少' : '可预约';

    const full = fullSet(dayOffset);
    document.getElementById('slots').innerHTML = SLOTS.map((s, i) =>
      `<button class="bk-slot ${slot === s ? 'is-on' : ''} ${full.has(i) ? 'is-full' : ''}" data-slot="${s}">${s}</button>`).join('');

    document.getElementById('peopleN').textContent = people;
  }

  document.getElementById('main').addEventListener('click', e => {
    const a = e.target.closest('[data-item]');
    if (a) { itemIdx = +a.dataset.item; slot = ''; render(); return; }
    const b = e.target.closest('[data-day]');
    if (b) { dayOffset = +b.dataset.day; slot = ''; render(); return; }
    const c = e.target.closest('[data-slot]');
    if (c) { slot = c.dataset.slot; render(); return; }
    const p = e.target.closest('[data-p]');
    if (p) {
      people = Math.min(8, Math.max(1, people + (+p.dataset.p)));
      document.getElementById('peopleN').textContent = people;
    }
  });

  document.getElementById('submit').addEventListener('click', () => {
    if (!slot) return QY.toast('请先选择到店时段', 1400);
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    if (!name) return QY.toast('请填写称呼', 1400);
    if (!/^1[3-9]\d{9}$/.test(phone)) return QY.toast('手机号格式不对', 1600);

    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    const rec = QY.booking.add({
      service: ITEMS[itemIdx], date: dateStr, slot, people, name, phone,
      shop: SHOP.name + ' ' + SHOP.branch
    });

    document.getElementById('ttl').textContent = '预约成功';
    document.getElementById('main').innerHTML = `
      <div class="bk-ok">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
        <h2>预约已提交</h2>
        <p>门店会在 30 分钟内电话确认</p>
      </div>
      <div class="bk-ticket">
        <div class="r"><span>预约号</span><b>${rec.id}</b></div>
        <div class="r"><span>项目</span><b>${QY.esc(rec.service)}</b></div>
        <div class="r"><span>时间</span><b>${rec.date} ${rec.slot}</b></div>
        <div class="r"><span>人数</span><b>${rec.people} 人</b></div>
        <div class="r"><span>门店</span><b>${QY.esc(rec.shop)}</b></div>
        <div class="r"><span>联系方式</span><b>${rec.phone}</b></div>
      </div>
      <div style="display:flex;gap:10px;padding:18px 18px 24px">
        <a class="btn btn--ghost" style="flex:1" href="${QY.root}trade/home.html">返回首页</a>
        <a class="btn btn--primary" style="flex:1" href="${QY.root}member/center.html">查看我的</a>
      </div>`;
    QY.toast('预约成功', 1400);
  });

  render();
  QY.tabbar('mine');
})();
</script>
</body>
</html>
